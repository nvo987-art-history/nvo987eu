name: Update Events JSON (Île-de-France Open Data)

on:
  schedule:
    # Every Monday at 06:15 UTC
    - cron: "15 6 * * 1"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Île-de-France Open Data JSON
        run: |
          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -A "NVO987-events-updater/1.0" \
            "https://opendata.iledefrance.fr/api/explore/v2.1/catalog/datasets/mon-ete-ma-region/exports/json?lang=fr&timezone=Europe%2FBerlin" \
            -o events-iledefrance.json

      - name: Validate JSON
        run: |
          python3 -m json.tool events-iledefrance.json > /dev/null
          echo "events-iledefrance.json is valid JSON."

      - name: Show record count
        run: |
          python3 <<'PY'
          import json

          with open(
              "events-iledefrance.json",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          if isinstance(data, list):
              count = len(data)
          elif isinstance(data, dict):
              if isinstance(data.get("records"), list):
                  count = len(data["records"])
              elif isinstance(data.get("results"), list):
                  count = len(data["results"])
              else:
                  count = 1
          else:
              count = 0

          print(
              f"Île-de-France records: {count}"
          )
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add events-iledefrance.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update events-iledefrance.json"
            git push
          fi
