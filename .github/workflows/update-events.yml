name: Update Events JSON

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Paris Open Data
        run: |
          curl -fL \
            "https://opendata.paris.fr/api/records/1.0/search/?dataset=que-faire-a-paris-&rows=50&sort=-date_start" \
            -o paris.json

      - name: Download Île-de-France Open Data
        run: |
          curl -fL \
            "https://opendata.iledefrance.fr/api/explore/v2.1/catalog/datasets/mon-ete-ma-region/records?limit=100&where=past%3Dfalse" \
            -o iledefrance.json

      - name: Validate source files
        run: |
          python3 -m json.tool paris.json > /dev/null
          python3 -m json.tool iledefrance.json > /dev/null

      - name: Merge event sources
        run: |
          python3 scripts/merge_events.py

      - name: Validate final events JSON
        run: |
          python3 -m json.tool events.json > /dev/null

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add events.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update events.json"
            git push
          fi
