name: Update Events JSON

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Paris Open Data
        run: |
          curl -fL \
            "https://opendata.paris.fr/api/records/1.0/search/?dataset=que-faire-a-paris-&rows=50&sort=-date_start" \
            -o paris.json

      - name: Find and download DATAtourisme FMA CSV
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          api_url = (
              "https://www.data.gouv.fr/api/1/datasets/"
              "datatourisme-la-base-nationale-des-donnees-publiques-dinformation-touristique-en-open-data"
          )

          with urllib.request.urlopen(api_url, timeout=60) as response:
              data = json.load(response)

          resources = data.get("resources", [])

          candidates = []
          for resource in resources:
              title = (resource.get("title") or "").lower()
              url = resource.get("url") or ""
              fmt = (resource.get("format") or "").lower()

              if "datatourisme-fma" in title and fmt == "csv":
                  candidates.append(resource)

          if not candidates:
              raise RuntimeError("DATAtourisme FMA CSV resource not found.")

          resource = candidates[0]

          print("DATAtourisme resource:")
          print(resource.get("title"))
          print(resource.get("url"))

          urllib.request.urlretrieve(
              resource["url"],
              "datatourisme-fma.csv"
          )
          PY

      - name: Validate Paris JSON
        run: |
          python3 -m json.tool paris.json > /dev/null

      - name: Merge event sources
        run: |
          python3 scripts/merge_events.py

      - name: Validate final JSON
        run: |
          python3 -m json.tool events.json > /dev/null

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add events.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update events.json"
            git push
          fi
