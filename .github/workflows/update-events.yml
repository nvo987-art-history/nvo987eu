name: Test Île-de-France Events

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-idf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Île-de-France Events
        run: |
          curl -fL \
            "https://opendata.iledefrance.fr/api/explore/v2.1/catalog/datasets/mon-ete-ma-region/records?limit=100&where=past%3Dfalse" \
            -o iledefrance.json

      - name: Validate JSON
        run: |
          python3 -m json.tool iledefrance.json > /dev/null

      - name: Check data
        run: |
          python3 - <<'PY'
          import json

          with open("iledefrance.json", encoding="utf-8") as f:
              data = json.load(f)

          results = data.get("results", [])

          print("Rekordok száma:", len(results))

          if not results:
              raise SystemExit("NINCS ESEMÉNY!")

          print("\nElső esemény:")
          print(json.dumps(
              results[0],
              ensure_ascii=False,
              indent=2
          ))
          PY

      - name: Save test data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add iledefrance.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Test Île-de-France events source"
            git push
          fi
